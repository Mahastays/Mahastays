# Local infrastructure:
#   docker compose up -d                  → MongoDB (single-node replica set) + Redis; run the API on your machine with `npm run dev`
#   docker compose --profile app up --build   → also builds and runs the API container
#
# From your host machine connect with  directConnection=true  (see .env.example).
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
    healthcheck:
      # initiates the replica set on first start, then just reports its status
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    build: .
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['4000:4000']
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mongodb://mongo:27017/mahastays?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-none}
      COOKIE_SECURE: 'false' # set true + COOKIE_SAMESITE behind HTTPS

volumes:
  mongo_data:
